<!doctype html>
<meta charset="utf-8">
<title>Dashboard header layout</title>
<style>
  html, body { margin: 0; overflow: hidden; }
  iframe { display: block; border: 0; width: 100vw; height: 100vh; }
</style>
<pre id="result" hidden>Browser measurement did not complete.</pre>
<iframe id="page" src="/dashboard#csrf=1234"></iframe>
<script>
window.addEventListener('load', () => {
  const page = document.querySelector('#page'), win = page.contentWindow, doc = page.contentDocument;
  const report = {failures: [], font: parseFloat(getComputedStyle(document.documentElement).fontSize),
    viewport: innerWidth, zoom: devicePixelRatio, type: {}};
  try {
    const header = doc.querySelector('header');
    const usage = {
      fiveHour: {pct: 64}, sevenDay: {pct: 87}, scoped: [{name: 'Fable', pct: 100}],
    };
    const windows = [usage.fiveHour, usage.sevenDay, usage.scoped[0]];
    for (const [i, w] of windows.entries()) w.resetsAt = new Date(Date.now() + (i + 2.5) * 86400000).toISOString();
    const accounts = Array.from({length: 8}, (_, i) => ({
      number: i+1, email: 'user' + (i+1) + '@demo.test', isActive: i === 0, atLimit: true, usage,
    }));
    const sessions = Array.from({length: 10}, (_, i) => ({
      sessionId: '11111111-1111-4111-8111-' + String(i).padStart(12,'0'), pid: i+2, cwd: '/work/shared',
      title: 'Review the weekly usage report and the reset time for the integration account ' + (i+1),
      status: 'busy', login: 'default login', accountNumber: '1',
    }));
    const state = {version: '0.21.3', updates: {available: true}, settings: [], accounts, sessions: {claude: sessions},
      fable: {state: 'on', number: 2, email: accounts[1].email},
      mythos: {number: 8, email: accounts[7].email, countedWindows: ['7d','Fable'], atLimit: true,
        limitingWindows: ['Fable'], resetClock: 'Jan 25 18:30', linkedSessions: 0}};
    function render(view) {
      win.events.dispatchEvent(new MessageEvent('state', {data: JSON.stringify(view)}));
    }

    function readable(el, expected) {
      if (!el || !expected || el.textContent !== expected) return false;
      if (el.clientWidth && el.scrollWidth > el.clientWidth || el.clientHeight && el.scrollHeight > el.clientHeight) return false;
      const range = doc.createRange();
      range.selectNodeContents(el);
      return visibleRange(el, range);
    }
    function visibleRange(el, range) {
      const lines = [...range.getClientRects()];
      return lines.length > 0 && lines.every(r => {
        if (r.width <= 0 || r.height <= 0 || r.left < 0 || r.right > doc.documentElement.clientWidth) return false;
        // A user can scroll vertically to a line, including one below the initial viewport at 200%.
        const y = (r.top + r.bottom) / 2;
        const fromTop = win.scrollY;
        win.scrollBy({top: y - win.innerHeight / 2, behavior: 'instant'});
        const screenY = y - (win.scrollY - fromTop);
        const inset = Math.min(1 / win.devicePixelRatio, r.width / 2);
        const visible = [r.left + inset, (r.left + r.right) / 2, r.right - inset].every(x => el.contains(doc.elementFromPoint(x, screenY)));
        win.scrollTo({top: fromTop, behavior: 'instant'});
        return visible;
      });
    }

    function checkFacts(view, condition) {
      render(view);
      const facts = [
        ['active account', header.querySelector('.hdr-name'), view.accounts[0].email],
        ['active limit', header.querySelector('.hdr-who .chip-crit'), 'at limit'],
        ['Fable login', header.querySelector('.hdr-fable > span'), 'Fable: #2 ' + view.fable.email],
      ];
      if (view.mythos) {
        facts.push(['Mythos login', header.querySelector('.hdr-mythos > :first-child'), 'Mythos login: #8 ' + view.mythos.email],
          ['Mythos limit and reset', header.querySelector('.hdr-mythos-detail'), 'counting 7d + Fable · at limit: Fable until Jan 25 18:30 · 0 linked sessions']);
      }
      const meters = [...header.querySelectorAll('.hdr-meters .meter')];
      if (meters.length !== windows.length) report.failures.push(condition + ': missing meters');
      for (const [i, m] of meters.entries()) {
        const label = ['5h','7d','Fable'][i], foot = m.querySelector('.meter-foot'), track = m.querySelector('.meter-track');
        facts.push([label, m.querySelector('.meter-label'), label], [label + ' usage', m.querySelector('.meter-val'), windows[i].pct + '%'],
          [label + ' reset', foot, foot.textContent]);
        if (!/^↻ \d+d \d+h$/.test(foot.textContent) || foot.dataset.resets !== windows[i].resetsAt ||
            !track.clientWidth || !track.clientHeight) report.failures.push(condition + ': missing usage or reset for ' + label);
      }
      for (const [name, el, expected] of facts) {
        if (!readable(el, expected)) report.failures.push(condition + ': clipped, covered or missing ' + name);
      }
      if (header.scrollWidth > header.clientWidth || doc.documentElement.scrollWidth > doc.documentElement.clientWidth) {
        report.failures.push(condition + ': sideways scrolling');
      }
    }

    checkFacts(state, 'window');
    page.style.width = '320px';
    if (win.innerWidth !== 320) throw new Error('320 CSS pixel viewport was not applied');
    checkFacts(state, 'narrow viewport');
    const basic = {...state, mythos: null};
    checkFacts(basic, 'narrow viewport without Mythos');
    render(state);
    const aliased = structuredClone(state);
    aliased.accounts[0].alias = 'Build team';
    aliased.accounts[1].alias = 'Editing team';
    function checkAliases() {
      render(aliased);
      for (const [row, selector] of [[aliased.accounts[0], '.hdr-who'], [aliased.accounts[1], '.hdr-fable']]) {
        const group = header.querySelector(selector);
        for (const text of [row.alias, row.email]) {
          const nodes = doc.createTreeWalker(group, NodeFilter.SHOW_TEXT);
          let node, seen = false;
          while ((node = nodes.nextNode())) {
            const at = node.data.indexOf(text);
            if (at < 0) continue;
            const range = doc.createRange();
            range.setStart(node, at);
            range.setEnd(node, at + text.length);
            if (visibleRange(node.parentElement, range)) { seen = true; break; }
          }
          if (!seen) report.failures.push('aliased login: clipped, covered or missing ' + text);
        }
      }
    }
    checkAliases();
    aliased.accounts[1].email = 'fresh.fable@demo.test';
    aliased.fable.email = aliased.accounts[1].email;
    checkAliases();
    aliased.accounts[0].email = 'fresh.active@demo.test';
    checkAliases();
    render(state);

    function besideBrand() {
      const range = doc.createRange();
      range.selectNodeContents(doc.querySelector('#hdr-acct'));
      const accounts = range.getBoundingClientRect(), brand = header.querySelector('.brand').getBoundingClientRect();
      return accounts.left >= brand.right && accounts.top < brand.bottom && accounts.bottom > brand.top;
    }
    const scrollbar = win.innerWidth - doc.documentElement.clientWidth;
    function room(rem) { page.style.width = 'calc(' + rem + 'rem + ' + scrollbar + 'px)'; }
    // Measure the first whole rem with the brand and accounts side by side.
    function wrapPoint(view) {
      render(view);
      let lo = 20, hi = 160;
      room(lo);
      if (besideBrand()) throw new Error('header does not wrap in a narrow container');
      room(hi);
      if (!besideBrand()) throw new Error('header wraps despite ample space');
      while (hi - lo > 1) {
        const mid = Math.floor((lo + hi) / 2);
        room(mid);
        if (besideBrand()) hi = mid; else lo = mid;
      }
      return hi;
    }
    report.wrapRem = wrapPoint(state);
    function accountWidths(rem) {
      room(rem);
      return [...header.querySelectorAll('#hdr-acct, .hdr-meters .meter')].map(e => e.clientWidth);
    }
    const narrow = accountWidths(20), roomy = accountWidths(120), wider = accountWidths(160);
    if (narrow[0] >= roomy[0] || roomy.some((width, i) => width !== wider[i])) {
      report.failures.push('account summary must adapt to available space and stop growing on a wide screen');
    }
    const long = structuredClone(state);
    long.mythos.email = 'infrastructure.monitoring.production-oncall+north-region@regional.engineering.example.test';
    if (wrapPoint(long) <= report.wrapRem) report.failures.push('longer content did not change the wrap point');
    room(80);
    for (const selector of ['.brand-name', '#version', '#conn-text', '.hdr-name', '.hdr-fable', '.hdr-mythos-detail',
      '.hdr-acct .slot-chip', '.hdr-who .chip-crit', '.hdr-meters .meter-label', '.hdr-meters .meter-val', '.hdr-meters .meter-foot']) {
      report.type[selector] = parseFloat(win.getComputedStyle(header.querySelector(selector)).fontSize) / report.font;
    }
  } catch (error) { report.failures.push(String(error.stack || error)); }
  document.querySelector('#result').textContent = JSON.stringify(report);
});
</script>
