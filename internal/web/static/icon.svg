<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="tycswap">
  <title>tycswap — the octopus swapping two logins</title>
  <defs>
    <!-- userSpaceOnUse: a plain horizontal stroke has a zero-height bounding box, which would make an objectBoundingBox gradient vanish -->
    <linearGradient id="poles" gradientUnits="userSpaceOnUse" x1="-120" y1="0" x2="120" y2="0">
      <stop offset="0%" stop-color="#5aa2ff"/><stop offset="48%" stop-color="#8b6cf0"/><stop offset="100%" stop-color="#ff4a3d"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0e1420"/>
  <g transform="translate(32 24) scale(0.18)" fill="none" stroke="url(#poles)" stroke-linecap="round" stroke-linejoin="round" stroke-width="13">
    <!-- eight arms: the outer pair reaches out and holds a login card each -->
    <g>
      <path d="M-40,22 C-70,24 -97,40 -105,64 C-111,83 -97,95 -85,87 C-76,81 -79,69 -88,69"/>
      <path d="M-28,31 C-50,45 -69,64 -71,88 C-72,105 -59,114 -49,106 C-41,99 -45,88 -54,89"/>
      <path d="M-15,36 C-26,60 -34,82 -30,103 C-27,118 -14,123 -8,113"/>
      <path d="M-5,37 C-7,60 -10,79 -6,95"/>
      <g transform="scale(-1,1)">
        <path d="M-40,22 C-70,24 -97,40 -105,64 C-111,83 -97,95 -85,87 C-76,81 -79,69 -88,69"/>
        <path d="M-28,31 C-50,45 -69,64 -71,88 C-72,105 -59,114 -49,106 C-41,99 -45,88 -54,89"/>
        <path d="M-15,36 C-26,60 -34,82 -30,103 C-27,118 -14,123 -8,113"/>
        <path d="M-5,37 C-7,60 -10,79 -6,95"/>
      </g>
    </g>
    <!-- head -->
    <path d="M-53,-2 C-53,-42 -30,-66 0,-66 C30,-66 53,-42 53,-2 C53,20 30,35 0,35 C-30,35 -53,20 -53,-2 Z" fill="#0b1018"/>
    <g stroke="none" fill="#b48cf5"><ellipse cx="-19" cy="-10" rx="8" ry="9.5"/><ellipse cx="19" cy="-10" rx="8" ry="9.5"/></g>
    <path d="M-9,12 C-4,17 4,17 9,12" stroke-width="9"/>
    <!-- the two login cards, one in each outer arm: blue for the one going live, red for the one going back to the store -->
    <g stroke="none">
      <rect x="-124" y="50" width="44" height="30" rx="7" fill="#0b1018" stroke="#5aa2ff" stroke-width="7"/>
      <rect x="-124" y="58" width="44" height="6" fill="#5aa2ff"/>
      <rect x="-115" y="69" width="16" height="5" rx="2.5" fill="#5aa2ff"/>
      <rect x="80" y="50" width="44" height="30" rx="7" fill="#0b1018" stroke="#ff4a3d" stroke-width="7"/>
      <rect x="80" y="58" width="44" height="6" fill="#ff4a3d"/>
      <rect x="89" y="69" width="16" height="5" rx="2.5" fill="#ff4a3d"/>
    </g>
    <!-- the swap: two arrows passing each other under the arms -->
    <g stroke-width="11">
      <path d="M-50,143 L50,143 M36,131 L50,143 L36,155"/>
      <path d="M50,170 L-50,170 M-36,158 L-50,170 L-36,182"/>
    </g>
  </g>
</svg>
