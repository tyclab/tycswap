---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The tests of the tray application in internal/cli (DESIGN A35-A45): what
  # the macOS job runs of that package until the rest of the suite holds on
  # macOS too (the store under ~/.tycswap, the login Keychain).
  APP_TESTS: '^Test(App|Bare(TTY|NonTTY|MSYS)|BadgeIcon|BrandRow|CheckForUpdates|CheckOutcome|ClaudeCode|DashboardCheck|Headless|InstallUpdate|OfferUpdate|OpenAppLog|OpenDashboardFailure|ParseAppArgs|PurgeRefused|ReleaseOwnConsole|Remote|SecondApp|Shell|SpawnDetached|UIPrefs|Update|AutoFacadeRemembers)'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The Makefile targets, so CI and a developer's machine run the same commands.
      - run: make fmt
      - run: make vet
      - run: make test
      # The darwin and windows code compiles from Linux too: the tray, the
      # autostart registry, the console hand-off (DESIGN A35, A41).
      - run: GOOS=windows go vet ./...
      - run: GOOS=darwin CGO_ENABLED=0 go vet ./...

  # The Windows tray, the detached start and the console hand-off run for
  # real here; their tests are build-tagged (DESIGN A41). The whole
  # suite runs: every test keeps its home in a temporary directory
  # (testutil.IsolateHome sets USERPROFILE, which os.UserHomeDir reads here).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...

  # macOS builds internal/tray with cgo against Cocoa, the one place cgo is
  # allowed (DESIGN A12, A35): this job compiles and tests the Objective-C,
  # then the CGO_ENABLED=0 stub a machine without a C toolchain gets. The rest
  # of the suite does not hold on macOS yet (the store under ~/.tycswap, the
  # login Keychain), so this job runs the tray application's packages and
  # tests.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./internal/tray/... ./internal/appicon/... ./internal/autostart/... ./internal/brand/... ./internal/web/... ./internal/update/...
      - run: go test -count=1 -v ./internal/cli -run "$APP_TESTS"
      - run: CGO_ENABLED=0 go build ./...
