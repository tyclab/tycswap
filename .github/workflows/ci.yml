---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Each push to main keeps its own run: its release waits for it (DESIGN A119).
# The macos job is its own workflow, macos.yml (DESIGN A121).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install terminal prompt runtime
        # Measured on 2026-11-11: the runner's resolver (Azure's) timed out for
        # Ubuntu's three mirror names for an hour while public resolvers
        # answered them, and `apt-get update` exits 0 even then. When the
        # mirror does not resolve, public resolvers go in front of the
        # runner's; the pair is retried for shorter faults.
        run: |
          link=$(ip route show default | awk '{print $5; exit}')
          for attempt in 1 2 3; do
            if ! timeout 15 getent hosts azure.archive.ubuntu.com >/dev/null; then
              echo "::warning::the runner's resolver does not answer for the package mirror; adding public resolvers"
              sudo resolvectl dns "$link" 1.1.1.1 9.9.9.9 168.63.129.16
              sudo resolvectl flush-caches
            fi
            if sudo apt-get update && sudo apt-get install -y zsh; then
              exit 0
            fi
            sleep 15
          done
          exit 1
      # The Makefile targets, so CI and a developer's machine run the same commands.
      - name: CHANGELOG.md check against the base, and what the merge releases (DESIGN A121)
        run: make release-check RELEASE_BASE=HEAD^1
      # Two jobs that run `releasectl publish` at once split a release in two;
      # one shared concurrency group keeps them apart (DESIGN A121).
      - name: Every release.yml job that publishes shares one concurrency group
        run: |
          yq -e '[.jobs[] | select([.steps[].run // "" | test("releasectl publish")] | any)]
            | [length > 1, (map(.concurrency.group) | unique | length) == 1,
               all_c(.concurrency.group != null and .concurrency["cancel-in-progress"] == false)] | all' \
            .github/workflows/release.yml ||
            { echo "::error::the jobs of release.yml that run releasectl publish must declare the same concurrency.group and cancel-in-progress: false"; exit 1; }
      - run: make fmt
      - run: make vet
      - run: make test
      - run: make vuln
      # The darwin and windows code compiles from Linux too: the tray, the
      # autostart registry, the console hand-off (DESIGN A35, A41).
      - run: GOOS=windows go vet ./...
      - run: GOOS=darwin CGO_ENABLED=0 go vet ./...

  # The Windows tray, the detached start and the console hand-off run for real
  # here; their tests are build-tagged (DESIGN A41). The whole suite runs: each
  # test's home is a temporary directory (testutil.IsolateHome sets USERPROFILE).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...
