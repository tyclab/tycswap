---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install terminal prompt runtime
        # Measured on 2026-11-11: the runner's resolver (Azure's) timed out for
        # Ubuntu's three mirror names for an hour while public resolvers
        # answered them, and `apt-get update` exits 0 even then. When the
        # mirror does not resolve, public resolvers go in front of the
        # runner's; the pair is retried for shorter faults.
        run: |
          link=$(ip route show default | awk '{print $5; exit}')
          for attempt in 1 2 3; do
            if ! timeout 15 getent hosts azure.archive.ubuntu.com >/dev/null; then
              echo "::warning::the runner's resolver does not answer for the package mirror; adding public resolvers"
              sudo resolvectl dns "$link" 1.1.1.1 9.9.9.9 168.63.129.16
              sudo resolvectl flush-caches
            fi
            if sudo apt-get update && sudo apt-get install -y zsh; then
              exit 0
            fi
            sleep 15
          done
          exit 1
      # The Makefile targets, so CI and a developer's machine run the same commands.
      - run: make fmt
      - run: make vet
      - run: make test
      - run: make vuln
      # The darwin and windows code compiles from Linux too: the tray, the
      # autostart registry, the console hand-off (DESIGN A35, A41).
      - run: GOOS=windows go vet ./...
      - run: GOOS=darwin CGO_ENABLED=0 go vet ./...

  # The Windows tray, the detached start and the console hand-off run for
  # real here; their tests are build-tagged (DESIGN A41). The whole
  # suite runs: every test keeps its home in a temporary directory
  # (testutil.IsolateHome sets USERPROFILE, which os.UserHomeDir reads here).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...

  # macOS builds internal/tray with cgo against Cocoa, the one place cgo is
  # allowed (DESIGN A12, A35): this job compiles and tests the Objective-C
  # with the whole suite, then the CGO_ENABLED=0 stub a machine without a C
  # toolchain gets.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...
      - run: CGO_ENABLED=0 go build ./...
