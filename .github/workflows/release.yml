# A release for every merge that adds CHANGELOG.md entries (DESIGN A119,
# A121). When CI or macOS completes on a merge to main, the entries the
# merge commit has over the newest tag before it are released under a
# computed version: the commit is tagged once test and windows passed there
# (macos passed, has not started or found no runner) and published with
# those entries as its notes: Linux and Windows with SHA256SUMS at once,
# macOS attached when a Mac has built it. A tag pushed by hand builds a
# draft, as before; a dispatch with a tag finishes and publishes that tag's
# release. Every decision is internal/release's (releasectl); the Retry
# workflow reruns a job that found no runner.
name: Release

on:
  workflow_run:
    workflows: [CI, macOS]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing v* tag whose release to build, attach and publish
        required: true
        type: string

permissions: {}

jobs:
  decide:
    # Only CI and macOS on this repository's own pushes to main:
    # workflow_run also reports pull request runs, from forks too.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      create-tag: ${{ steps.plan.outputs.create-tag }}
      publish: ${{ steps.plan.outputs.publish }}
      linux-windows: ${{ steps.plan.outputs.linux-windows }}
      darwin: ${{ steps.plan.outputs.darwin }}
    steps:
      # releasectl as main has it, also for a tag on an older commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: >-
          go run ./internal/release/releasectl decide --event "$EVENT" --tag "$TAG"
          --commit "$COMMIT" --attempt "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  # The one job that writes a tag: annotated, on the merge commit, pushed with
  # this run's token (which starts no push workflow, hence the builds below).
  # It computes the version again after fetching the tags: when another
  # run's tag took the name meanwhile, the version moves past it, and when
  # another run tagged this commit or a later one carrying its entries, that
  # run releases them and this one stops here.
  tag:
    needs: decide
    if: needs.decide.outputs.create-tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.claim.outputs.tag }}
      release: ${{ steps.claim.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - id: claim
        env:
          COMMIT: ${{ needs.decide.outputs.commit }}
        run: >-
          go run ./internal/release/releasectl tag --commit "$COMMIT"
          --attempt "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  # Linux and Windows are pure Go: the Windows tray speaks Win32 through
  # golang.org/x/sys, and Linux's through D-Bus.
  linux-windows:
    needs: [decide, tag]
    if: >-
      ${{ !cancelled() && needs.decide.outputs.linux-windows == 'true' &&
      (needs.tag.result == 'skipped' ||
      (needs.tag.result == 'success' && needs.tag.outputs.release == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.tag.outputs.tag || needs.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag || needs.decide.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X github.com/tyclab/tycswap/internal/version.Version=$TAG" \
              -o "dist/tycswap_${TAG}_${os}_${arch}${ext}" ./cmd/tycswap
          done
      - name: Smoke test
        run: ./dist/tycswap_"${TAG}"_linux_amd64 --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-windows
          path: dist/*
          if-no-files-found: error

  # macOS links the menu-bar tray against Cocoa through cgo (DESIGN A12,
  # A35), so it builds on a Mac: arm64 natively, amd64 with clang told the
  # architecture.
  darwin:
    needs: [decide, tag]
    if: >-
      ${{ !cancelled() && needs.decide.outputs.darwin == 'true' &&
      (needs.tag.result == 'skipped' ||
      (needs.tag.result == 'success' && needs.tag.outputs.release == 'true')) }}
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.tag.outputs.tag || needs.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag || needs.decide.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X github.com/tyclab/tycswap/internal/version.Version=$TAG"
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -buildvcs=false \
            -ldflags "$ldflags" -o "dist/tycswap_${TAG}_darwin_arm64" ./cmd/tycswap
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64" \
            go build -trimpath -buildvcs=false \
            -ldflags "$ldflags" -o "dist/tycswap_${TAG}_darwin_amd64" ./cmd/tycswap
      - name: Smoke test
        run: |
          set -euo pipefail
          ./dist/tycswap_"${TAG}"_darwin_arm64 --version
          ./dist/tycswap_"${TAG}"_darwin_arm64 app --help > /dev/null
          lipo -archs "dist/tycswap_${TAG}_darwin_amd64" | grep -qx x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin
          path: dist/*
          if-no-files-found: error

  # Attaches Linux and Windows with SHA256SUMS and the notes (the entries the
  # commit adds over the tag before it), then publishes: nothing is visible
  # before all of them are there.
  publish:
    needs: [decide, tag, linux-windows]
    if: ${{ !cancelled() && needs.linux-windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-windows
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag || needs.decide.outputs.tag }}
          COMMIT: ${{ needs.decide.outputs.commit }}
          PUBLISH: ${{ needs.decide.outputs.publish }}
        run: go run ./internal/release/releasectl publish --tag "$TAG" --commit "$COMMIT" --dist dist --publish="$PUBLISH"

  # Attaches macOS to the release, published or not, and completes
  # SHA256SUMS; it never publishes, and writes notes into a draft only.
  attach-darwin:
    needs: [decide, tag, darwin]
    if: ${{ !cancelled() && needs.darwin.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: darwin
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag || needs.decide.outputs.tag }}
          COMMIT: ${{ needs.decide.outputs.commit }}
        run: go run ./internal/release/releasectl publish --tag "$TAG" --commit "$COMMIT" --dist dist --publish=false
