---
# A release for every v* tag: the binaries the README lists, built from the
# tag, attached to the GitHub release of that tag with their SHA256SUMS. A tag
# without a release gets a draft, so the notes are written before anyone's
# `tycswap upgrade` can see it. Nothing is signed (README: Tray application).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Find or draft the release
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "tycswap $TAG" --notes "Release notes to follow; see CHANGELOG.md."

  # Linux and Windows are pure Go: the Windows tray speaks Win32 through
  # golang.org/x/sys, and Linux's through D-Bus.
  linux-windows:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X github.com/tyclab/tycswap/internal/version.Version=$TAG" \
              -o "dist/tycswap_${TAG}_${os}_${arch}${ext}" ./cmd/tycswap
          done
      - name: Smoke test
        run: ./dist/tycswap_${TAG}_linux_amd64 --version
      - name: Upload
        run: gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"

  # macOS links the menu-bar tray against Cocoa through cgo (DESIGN A12,
  # A35), so it builds on a Mac: arm64 natively, amd64 with clang told the
  # architecture.
  darwin:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X github.com/tyclab/tycswap/internal/version.Version=$TAG"
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -buildvcs=false \
            -ldflags "$ldflags" -o "dist/tycswap_${TAG}_darwin_arm64" ./cmd/tycswap
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64" \
            go build -trimpath -buildvcs=false \
            -ldflags "$ldflags" -o "dist/tycswap_${TAG}_darwin_amd64" ./cmd/tycswap
      - name: Smoke test
        run: |
          set -euo pipefail
          ./dist/tycswap_${TAG}_darwin_arm64 --version
          ./dist/tycswap_${TAG}_darwin_arm64 app --help > /dev/null
          lipo -archs "dist/tycswap_${TAG}_darwin_amd64" | grep -qx x86_64
      - name: Upload
        run: gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"

  checksums:
    needs: [linux-windows, darwin]
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p dist
          cd dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern "tycswap_${TAG}_*"
          sha256sum tycswap_* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
